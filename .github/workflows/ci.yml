name: CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Build, Lint & Test (Offline Dual-Mode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv

      - name: Run Test Suite with Pytest
        env:
          EXECUTION_MODE: mock
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Validate Local Dataflow & RAG Execution
        env:
          EXECUTION_MODE: mock
        run: |
          python -m src.pipeline.data_transformer
          python -m src.agent.policy_agent --query "Can I return pasta order ORD-01383?"
